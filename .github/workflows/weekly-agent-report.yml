# Informe semanal del agente (P&L vs meta). Usa el mismo NEWSLETTER_CRON_SECRET que Render.
name: Weekly agent report

on:
  schedule:
    # Lunes 14:00 UTC (~11:00 ART / ~10:00 ET): semana NY recién cerrada.
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly agent report
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN || vars.API_ORIGIN || secrets.VITE_API_ORIGIN }}
          NEWSLETTER_CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "::error::Falta API_ORIGIN (URL de la API en Render)."
            exit 1
          fi
          if [ -z "$NEWSLETTER_CRON_SECRET" ]; then
            echo "::error::Falta NEWSLETTER_CRON_SECRET."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: $NEWSLETTER_CRON_SECRET" \
            "$API_ORIGIN/api/agent/send-weekly-report"