# Blueprint para Render: https://render.com/docs/blueprint-spec
# En el dashboard: New → Blueprint → conecta este repo y despliega.
# Luego copia la URL pública (https://xxx.onrender.com) y úsala en GitHub como VITE_API_ORIGIN.

services:
  - type: web
    name: stock-info-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm run server
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Required for /api/fmp/fundamentals. Set in Render dashboard → Environment.
      # GitHub repo secrets do NOT apply here — only Render env vars do.
      - key: FMP_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      # Newsletter semanal (Top 20). Configurar en Render dashboard → Environment.
      - key: RESEND_API_KEY
        sync: false
      - key: NEWSLETTER_FROM_EMAIL
        sync: false
      # Debe coincidir con el secret NEWSLETTER_CRON_SECRET del workflow de GitHub Actions.
      - key: NEWSLETTER_CRON_SECRET
        sync: false
      # Dominio público del sitio, usado en el link de "darse de baja" del email.
      - key: SITE_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stock-info-db
          property: connectionString

databases:
  - name: stock-info-db
    plan: basic-256mb
    region: oregon
    databaseName: stock_info
